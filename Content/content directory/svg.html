<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG Shapes Demo</title>
  <style>
    svg {border: 1px solid black; background: #f9f9f9;}
    text { font-family: Arial, sans-serif;}
    .highlight { fill: orange; font-weight: bold;}
  </style>
</head>
<body>
   <h1>SVG with Shapes and Text</h1>
   <svg width="500" height="400">
      <!-- Rectangle -->
       <rect 
        x="10" 
        width="190"
        height="170" 
        fill="skyblue" 
        stroke="black" 
        stroke-width="2"
        />
      <!-- Circle -->
       <circle cx="250" cy="50" r="40" fill="tomato" stroke="black" stroke-width="2"/>
      <!-- Ellipse -->
       <ellipse 
        cx="400"
        cy="50" 
        rx="60" 
        ry="30" 
        fill="lightgreen" 
        stroke="black"
        sroke-width="2"
        />
      <!-- Polygon(triangle) -->
       <polygon
       points="80,200 20,300 140,300" 
       fill="gold" 
       stroke="black" 
       stroke="2" 
       />
      <!-- Polyline(zigzag) -->
       <polyline 
       points="200,200 250,250 300,200 350,250, 400,200" 
       fill="none" 
       stroke="blue" 
       stroke-width="2"
       />
      <!-- Polygon(triangle) -->
       <polygon
       points="500,10 420,200 550,350"
       fill="gray"
       stroke="green"
       />
       <!-- 
       (20,30)
       x=20=right
       y=30=left
       -->
      <!-- Path(custom shape: a curve) -->
       <path 
       d="M50 350 C 150 250, 350 450, 450 350" 
       fill="none"
       stroke="red" 
       stroke-width="2"
       />
      <!-- Text with <tspan> -->
        <text x="50" y="380" font-size="20" fill="black">
          SVG is <tspan class="highlight">PowerPoint</tspan> &Scalable
        </text>
      </svg>
</body>
</html>
