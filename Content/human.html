<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        svg {border: 1px solid bisque; background-color:darkgray;}
    </style>
</head>
<body>
    <svg width="500" height="500">
        <!-- Full face -->
        <ellipse
         cx="100"
         cy="90"
         rx="60"
         ry="80"
         fill="bisque"
        />
        <!-- Eye white -->
        <ellipse
        cx="125"
        cy="60"
        rx="19"
        ry="7"
        fill="white"
        stroke="darkgray"
        stroke-width="0.2"
        />
        <!-- Eye white -->
        <ellipse
         cx="75"
         cy="60"
         rx="19"
         ry="7"
         fill="white"
         stroke="darkgray"
         stroke-width="0.2"
        />
        <!-- black eye -->
        <circle
        cx="74"
        cy="60"
        fill="black"
        r="6.5"
        />
        <!-- black eye -->
        <circle
         cx="125"
         cy="60"
         fill="black"
         r="6.5"
        />
        <!-- nose -->
        <path
         d=""
         stroke="blue"
         fill="none"
         stroke-width="0.5"
        />
        
    </svg>
</body>
</html>
