<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Front-End Developer</title>
    <link rel="stylesheet" href="style/default.css">
</head>
<body>
    <header>
        <nav>
            <a style="color: black; text-decoration: none;" href="/Content/index.html">&nbsp;[about]</a>
            <a href="/Content/work.html">&nbsp;[project/work]</a>
            <a href="/Content/resume.html">&nbsp;[resume]</a>
            <a href="/Content/contant.html">&nbsp;[contact]</a>
            <a href="/Content/content directory/canvas.html">&nbsp;[canvas]</a>
            <a href="/Content/content directory/embed object iframe.html">&nbsp;[embed]</a>
            <a href="/Content/content directory/svg.html">&nbsp;[svg]</a>
            <a href="/Content/content directory/image audio video.html">&nbsp;[Image-audio-video]</a>
        </nav>
    </header>
    <main>
        <section id="contact" class="container">
            <h1>Get in touch</h1>
            <p>Feel free to reach out via following form.</p>
            <form action="sokbeannhavy123@gmail.com"
                    method="post" enctype="text/plain"
                >
                <div>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="email" required>
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+123456789">
                </div>
                <div>
                    <label for="company">Company/Organization</label>
                    <input type="text" id="company" name="company">
                </div>
                <div class="full-width">
                    <label for="subject">Subject</label>
                    <input type="text" name="subject" id="subject">
                </div>
                <div class="full-width">
                    <label for="reason">Reason for Contact</label>
                    <select name="reason" name="reason">
                        <option value="">--Select an Option</option>
                        <option value="project">Work on a project</option>
                        <option value="job">Job Opportunity</option>
                        <option value="collaboration">Collaboration</option>
                        <option value="gender">General Iquiry</option>
                    </select>
                </div>
                <div class="full-width">
                    <label for="message">Your Message</label>
                    <textarea name="message" id="message" rows="6" required></textarea>
                </div>
                <div class="checkbox">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe me to your newsletter</label>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </section>
        <section class="info">
            <p>Email: sokbeannhavy123@gmail.com</p>
            <p>Phone: +855 123456</p>
            <div class="social-links">
                <a href="https://github.com/yourusername">GitHub</a>
                <a href="https://linkdih.com/in/yourusername">LinkedIn</a>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My portfolio</p>
    </footer>
</body>
</html>
